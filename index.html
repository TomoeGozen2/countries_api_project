<!-- See all countries from the data on the homepage
Search for a country using an input field
Filter countries by region
Click on a country to see more detailed information on a separate page
Click through to the border countries on the detail page -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>countries</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <input type="text">
    <button type="submit" id = "searchButton">Search for country</button>
    <button type = "button" id = "resetButton">Reset Button</button>
    <select name="regions" id="regions">
        <option value="all_regions">All Regions</option>
        <option value="africa">Africa</option>
        <option value="americas">America</option>
        <option value="asia">Asia</option>
        <option value="europe">Europe</option>
        <option value="oceania">Oceania</option>
    </select>

    
    <ul class = "countriesList">

    </ul>

</body>

</html>
